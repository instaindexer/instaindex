services:
  - type: web
    name: pdf-forum-indexer
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: INDEXNOW_KEY
        value: lf2026pdf8x7y6z5w4v3u2t1s0r9q
      - key: GOOGLE_VERIFY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: MASTODON_INSTANCE
        value: https://mastodon.social
      - key: MASTODON_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
